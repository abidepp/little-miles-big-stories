# Editor configuration (Sveltia CMS) for Little Miles, Big Stories.
#
# Decides what the editor at /admin shows: one section for Journals, and one for
# each page's text. Field names must match src/content.config.ts (the site's schema);
# if you add a field here, add it there too, or the build will reject it.
# Docs: https://sveltiacms.app/en/docs

backend:
  name: github
  repo: abidepp/little-miles-big-stories
  branch: main
  # For "Sign in with GitHub" (see PUBLISHING.md, One-time setup), paste the auth Worker URL:
  # base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Changes are saved as drafts first and only go live when you click Publish.
publish_mode: editorial_workflow

# TODO: change both to https://littlemilesbigstories.com once the domain is connected
site_url: https://little-miles-big-stories.abinavdepp.workers.dev
display_url: https://little-miles-big-stories.abinavdepp.workers.dev

media_folder: public/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ------------------------------------------------------------------
  # Journals: each one is a card on /journals
  # ------------------------------------------------------------------
  - name: journals
    label: Journals
    label_singular: Journal
    description: >-
      Each journal appears as a card on the Journals page automatically.
      "Coming soon" journals show as small cards; "Draft" ones are hidden.
    folder: src/content/journals
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    delete: true
    format: frontmatter
    extension: md
    identifier_field: title
    summary: '{{title}} · {{status}}'
    sortable_fields: [order, title, status]
    fields:
      - name: title
        label: Title
        widget: string
        hint: 'e.g. "Cappadocia, without rushing it"'
      - name: status
        label: Status
        widget: select
        default: out-now
        options:
          - { label: 'Out now', value: out-now }
          - { label: 'Coming soon', value: coming-soon }
          - { label: 'Draft (hidden)', value: draft }
      - name: order
        label: Position
        widget: number
        value_type: int
        default: 1
        hint: Lower numbers are shown first.
      - name: tags
        label: Tags
        widget: list
        required: false
        field: { name: tag, label: Tag, widget: string }
        hint: 'Small labels on the card, e.g. "Journal 01", "Türkiye · 2 days", "With a 4-year-old"'
      - name: summary
        label: Card text
        widget: text
        required: false
        hint: One or two sentences on the card.
      - name: cover
        label: Cover photo
        widget: image
        required: false
      - name: coverAlt
        label: Cover photo description
        widget: string
        required: false
        hint: 'Describe the photo for people who can''t see it, e.g. "Hot air balloons over Cappadocia at sunrise".'
      - name: pdf
        label: PDF journal
        widget: file
        required: false
        media_folder: /public/journals
        public_folder: /journals
        hint: Upload the PDF and the card's "Download the PDF" button switches on.
      - name: cta
        label: Card link (coming soon cards)
        widget: object
        required: false
        collapsed: true
        hint: 'Optional, e.g. "Tell us" → /contact'
        fields:
          - { name: label, label: Link text, widget: string }
          - { name: url, label: Link address, widget: string }
      - name: body
        label: Full journal (optional)
        widget: markdown
        required: false
        hint: >-
          Leave empty for now. When you write the full story here, the journal gets
          its own page (/journals/<name>) with a "Read the journal" link on its card.

  # ------------------------------------------------------------------
  # Page text. Each is a single page, so new ones can't be created here.
  # ------------------------------------------------------------------
  - name: site
    label: 'Settings: title, tagline, Instagram, email'
    label_singular: Site settings
    folder: src/content/pages/site
    path: index
    create: false
    delete: false
    identifier_field: title
    fields:
      - { name: title, label: Site title, widget: string }
      - { name: tagline, label: Tagline (under the title), widget: string }
      - { name: footerLine, label: Footer line (handwritten), widget: string }
      - { name: instagramHandle, label: Instagram handle (without @), widget: string }
      - { name: email, label: Email address, widget: string, required: false }
      - name: contactFormKey
        label: Contact form key (Web3Forms)
        widget: string
        required: false
        hint: From web3forms.com. Until it's set, the form asks people to message you on Instagram.

  - name: home
    label: 'Page: Home'
    label_singular: Home page
    folder: src/content/pages/home
    path: index
    media_folder: ''
    public_folder: ''
    create: false
    delete: false
    identifier_field: heading
    fields:
      - { name: photo, label: Photo of Ish (portrait), widget: image, required: false }
      - { name: photoAlt, label: Photo description, widget: string, required: false }
      - { name: photoNote, label: Handwritten note on the photo, widget: string, required: false }
      - { name: label, label: Small label, widget: string }
      - { name: heading, label: Heading, widget: string }
      - { name: body, label: Paragraphs, widget: markdown }
      - { name: quote, label: Quote (handwritten), widget: text, required: false }
      - name: button
        label: Button
        widget: object
        fields:
          - { name: label, label: Text, widget: string }
          - { name: url, label: Link, widget: string }
      - name: banner
        label: Banner under the section
        widget: object
        required: false
        fields:
          - { name: tag, label: Small tag, widget: string, hint: 'e.g. "Out now · Free"' }
          - { name: text, label: Text, widget: string }
          - { name: url, label: Link, widget: string }

  - name: our-story
    label: 'Page: Our story'
    label_singular: Our story page
    folder: src/content/pages/our-story
    path: index
    media_folder: ''
    public_folder: ''
    create: false
    delete: false
    summary: Our story
    fields:
      - name: intro
        label: '1. Intro'
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: photo, label: Family photo, widget: image, required: false }
          - { name: photoAlt, label: Photo description, widget: string, required: false }
      - name: growing
        label: '2. From little passenger to fellow traveller'
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - name: cards
            label: Cards
            label_singular: Card
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
      - name: outdoors
        label: '3. Beaches to hiking trails'
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: photo, label: Photo, widget: image, required: false }
          - { name: photoAlt, label: Photo description, widget: string, required: false }
      - name: band
        label: '4. Latte band'
        widget: object
        fields:
          - { name: kicker, label: Small handwritten line, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
      - name: needs
        label: "5. Nobody's needs get left at home"
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - name: cards
            label: Cards
            label_singular: Card
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
      - name: places
        label: '6. Where little dino has been'
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - name: items
            label: Places
            label_singular: Place
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Place, widget: string, hint: 'e.g. "Istanbul, Türkiye"' }
              - { name: note, label: Note, widget: string, required: false, hint: 'e.g. "Journal out now"' }
      - name: closing
        label: '7. Closing'
        widget: object
        fields:
          - { name: kicker, label: Small handwritten line, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: button
            label: Button
            widget: object
            fields:
              - { name: label, label: Text, widget: string }
              - { name: url, label: Link, widget: string }

  - name: journals-page
    label: 'Page: Journals (page text)'
    label_singular: Journals page
    folder: src/content/pages/journals
    path: index
    create: false
    delete: false
    identifier_field: heading
    fields:
      - { name: label, label: Small label, widget: string }
      - { name: heading, label: Heading, widget: string }
      - { name: text, label: Text, widget: text }
      - { name: insideHeading, label: '"Inside every journal" heading', widget: string }
      - name: inside
        label: Inside every journal
        label_singular: Item
        widget: list
        summary: '{{fields.title}}'
        fields:
          - name: icon
            label: Icon
            widget: select
            options: [calendar, wallet, heart, skip, pin, sun, compass]
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: text }
      - { name: whyHeading, label: '"Why our journals" heading', widget: string }
      - name: why
        label: Why our journals (last card is dark)
        widget: list
        field: { name: line, label: Line, widget: text }
      - { name: listHeading, label: Heading above the journal cards, widget: string }

  - name: contact
    label: 'Page: Contact'
    label_singular: Contact page
    folder: src/content/pages/contact
    path: index
    create: false
    delete: false
    identifier_field: heading
    fields:
      - { name: heading, label: Heading, widget: string }
      - { name: text, label: Text, widget: text }
      - { name: privacy, label: Privacy note, widget: text }
